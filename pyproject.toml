[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "supportpilot-ai-agent"
version = "1.0.0"
description = "An AI customer support agent powered by LangGraph, LangChain RAG, Qdrant, and MCP."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "httpx>=0.28,<1",
  "langchain>=1.0,<2",
  "langchain-mcp-adapters>=0.2,<1",
  "langchain-openai>=1.0,<2",
  "langchain-qdrant>=1.0,<2",
  "langchain-text-splitters>=1.0,<2",
  "langgraph>=1.0,<2",
  "mcp>=1.20,<3",
  "pydantic-settings>=2.7,<3",
  "pypdf>=5,<7",
  "python-multipart>=0.0.20,<1",
  "qdrant-client>=1.12,<2",
  "streamlit>=1.42,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<10",
  "pytest-asyncio>=0.25,<2",
]

[project.scripts]
support-api = "support_pilot.api:run"
support-mcp = "support_pilot.mcp_server:main"
support-eval = "support_pilot.evaluation:main"

[tool.hatch.build.targets.wheel]
packages = ["src/support_pilot"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
